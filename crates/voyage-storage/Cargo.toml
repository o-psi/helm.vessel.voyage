[package]
name = "voyage-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Private local enrollment storage primitives"

[dependencies]
anyhow.workspace = true
ring = "0.17"
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_SystemServices"] }
uuid.workspace = true
