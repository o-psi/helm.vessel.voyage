# Copy to ~/.config/helm/config.toml.
provider = "openai-responses" # or "chatgpt-oauth" / "anthropic" / "openai-chat"
model = "gpt-5"
# Omit these keys for provider defaults (no override is sent).
# Native Responses, ChatGPT OAuth Responses, and OpenAI chat transport options:
# reasoning_effort = "medium" # none / minimal / low / medium / high / xhigh
# service_tier = "auto" # auto / default / flex / scale / priority
# These are request options, not promises of model support or account entitlement.
# Advertised model efforts narrow the choices when catalog metadata is available.
# Compatible endpoints may reject them. Anthropic and the Codex bridge reject
# all explicit overrides. Empty strings and "provider-default" are not sentinels.
api_key_env = "OPENAI_API_KEY"
# codex_command = "codex" # only for the optional "codex-compatibility" bridge
# base_url = "http://localhost:11434/v1"
# chatgpt_base_url is intentionally separate; normally leave it unset.
# Optional operator limits; 0 (the default) adds no Helm token cap.
# Anthropic requires an output value: Helm discovers its model capacity when unset.
# Older compatible Anthropic endpoints without model metadata need an explicit max_tokens.
max_tokens = 0
context_window = 0
provider_retry_attempts = 4
provider_retry_initial_ms = 500
provider_retry_max_ms = 8000
command_timeout_secs = 120
max_output_bytes = 131072
terminal_max_count = 16
terminal_max_unread_bytes = 8388608
# Defaults to half the available logical CPUs (minimum 1). Uncomment to override.
# subagent_max_concurrency = 4
subagent_event_history = 2048
# Agent authority: "read-only", "approval", or "unrestricted".
access = "approval"
# Deprecated compatibility setting for older Helm versions:
# approval = "on-risk"
# Unattended execution cannot display prompts. "deny" fails approval-required tools
# immediately; "allow" is an explicit high-trust override.
unattended_approval = "deny"

# Extra roots must already exist. The active workspace is always readable/writable.
allow_read = []
allow_write = []
deny_commands = ["shutdown", "reboot", "mkfs"]

# Child tools start with an empty environment. Only these host variables plus [env]
# are passed through. Secret-like names are rejected.
inherit_env = ["PATH", "LANG", "LC_ALL", "TERM"]
# Literal values to remove from tool output, errors, and approval records.
redact_values = []

[env]
# LANG = "C.UTF-8"

# [mcp_servers.files]
# command = "mcp-server-filesystem"
# args = ["/path/to/allowed/root"]
# [mcp_servers.files.env]
# LOG_LEVEL = "warn"

# Optional OS process isolation on the executing Linux x86_64 host.
# Requires /usr/bin/bwrap and working unprivileged user namespaces; no fallback.
# Default is off. See docs/configuration.md for limits and separate bridge grants.
# [sandbox]
# mode = "required"
# network = "denied"

# Native coordination of local/remote voyages, with bundled model guidance.
[vessel]
enabled = true
# Supervised runtimes discover their owner automatically.
# local_directory = "/absolute/private/vessel"

[vessel.remotes]
# build = "/absolute/private/build-vessel-access.json"

# Streamable HTTP MCP (Voyage-owned). Use HTTPS except literal loopback IP HTTP.
# MCP_REMOTE_TOKEN is an explicit HTTP-only reference to an executing-host env value.
# [mcp_servers.remote]
# url = "https://tools.example.com/mcp"
# bearer_token_env = "MCP_REMOTE_TOKEN"
