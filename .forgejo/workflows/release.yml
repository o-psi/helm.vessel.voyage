name: release
on:
  push:
    tags: ["v*"]

jobs:
  archives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: TARGET=${{ matrix.target }} ./scripts/package-release "${{ github.ref_name }}"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version "${{ github.ref_name }}" -Target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: voyage-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/*
