name: release
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare pinned browser worker dependency
        run: npm ci --prefix voyage/browser --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Build Linux binaries
        run: cargo build --workspace --release --locked
      - name: Package Linux binaries
        run: python3 packaging/package_linux.py --version "${{ github.ref_name }}" --bin-dir target/release --output dist/linux-release
      - uses: actions/upload-artifact@v4
        with:
          name: voyage-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: dist/linux-release/*
          if-no-files-found: error
# Product publication is an explicit maintainer action after local verification.
# Workflow artifacts are independent builds, not replacements for published assets.
