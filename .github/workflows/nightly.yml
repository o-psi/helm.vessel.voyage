name: nightly

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-linux
  cancel-in-progress: false

jobs:
  linux-x86_64:
    permissions:
      contents: write # Publish public development prereleases; stable latest is unchanged.
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Identify source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Skip source already built successfully
        id: changed
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            // Public releases persist beyond Actions artifact retention. Match
            // the actual checked-out source and complete archive/checksum pair.
            let built = false;
            for await (const page of github.paginate.iterator(
              github.rest.repos.listReleases, {...context.repo, per_page: 100}
            )) {
              built = page.data.some(r => {
                const m = /^nightly-([0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+\.[0-9]+)$/.exec(r.tag_name);
                if (!m || r.draft || !r.prerelease || r.target_commitish !== process.env.SOURCE_SHA) return false;
                const name = `voyage-${m[1]}-x86_64-unknown-linux-gnu.tar.gz`;
                return [name, `${name}.sha256`].every(n => r.assets.some(a => a.name === n && a.size > 0));
              });
              if (built) break;
            }
            core.setOutput('build', String(!built));
            core.summary.addRaw(built ? 'Skipped: this source already has a public nightly archive and checksum.' : 'Building a public development prerelease; no tests run.');
            await core.summary.write();
      - name: Set unique development version
        if: steps.changed.outputs.build == 'true'
        id: version
        run: python3 packaging/prepare_nightly.py
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.build == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.build == 'true'
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.build == 'true'
        with:
          node-version: '24'
      - name: Prepare pinned browser worker dependency (no tests)
        if: steps.changed.outputs.build == 'true'
        run: npm ci --prefix voyage/browser --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Build Linux binaries (no tests)
        if: steps.changed.outputs.build == 'true'
        run: cargo build --workspace --release --locked
      - name: Archive binaries and source identity
        if: steps.changed.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          name="voyage-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name/bin"
          for binary in helm vessel voyage voyage-installer; do
            install -m 755 "target/release/$binary" "dist/$name/bin/$binary"
          done
          python3 packaging/stage_nightly.py "dist/$name" "$VERSION"
          printf 'Development build: %s\nSource: %s\nLinux x86-64 only. No tests run. Not a stable release.\n' \
            "$VERSION" "$SOURCE_SHA" > "dist/$name/BUILD.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.build == 'true'
        with:
          name: nightly-${{ steps.source.outputs.sha }}-${{ steps.version.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish public nightly (never stable latest)
        if: steps.changed.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Separate namespace avoids the stable release workflow's v* tag trigger.
          tag="nightly-${VERSION}"
          name="voyage-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          printf 'Development build from main. No tests run by this workflow.\n\nSource: %s\nBuild: %s/%s/actions/runs/%s\n\nLinux x86-64, glibc 2.39+. Full binaries and browser worker; checksum included.\nInstall instructions: https://github.com/%s/blob/main/installer/README.md#public-nightly-installation\n' \
            "$SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > dist/notes.md
          gh release create "$tag" "dist/$name" "dist/$name.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "Nightly $VERSION" --notes-file dist/notes.md
