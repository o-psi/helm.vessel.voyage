name: quality
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify installer download and packaging failures offline
        run: python3 tests/system/installer_bootstrap.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release --locked
      - name: Verify configured GitHub capability and credential isolation
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/github_configured.py
      - name: Verify offline GitHub journal recovery through the real CLI
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/github_journal.py
      - name: Verify historical usage through the real CLI
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/inference_history.py
      - name: Verify full archive guides and publication failures
        run: python3 tests/system/release_documentation.py
      - name: Verify bounded model catalog discovery and safe display
        run: python3 tests/system/model_catalog.py
      - name: Verify mock installer through a real terminal and piped launcher
        run: python3 tests/system/installer_tui.py
      - name: Prove native provider works without Codex
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/native_provider_no_codex.py
      - name: Verify automatic session titles with an offline provider
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/session_titles.py
      - name: Verify active steering with an offline provider
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/steering.py
      - name: Verify interactive questions with an offline provider
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/questions.py
      - name: Verify recent conversations and voyage setup through a real terminal
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/voyage_ui.py
      - name: Verify modal paste isolation through a real terminal
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/paste_routing.py
      - name: Verify branch draft preservation and recovery
        run: python3 tests/system/branch_drafts.py
      - name: Verify tool output previews and expanded details
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/tool_output.py
      - name: Verify automatic subagent archival and lookup
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/subagent_archive.py
      - name: Verify subagent scheduling and resource behavior
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/subagent_resources.py
      - name: Verify context budgets and non-destructive resume with offline providers
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/context_window.py
      - name: Verify session execution fencing across independent frontends
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/session_fencing.py
      - name: Private managed sessions across real CLI processes
        run: python3 tests/system/local_managed.py
      - name: Resilient native execution
        run: python3 tests/system/resilient_execution.py
      - name: Dedicated remote session lifecycle
        run: python3 tests/system/remote_session.py
      - name: Dedicated remote completion and recovery
        run: python3 tests/system/remote_completion.py
      - name: Dedicated remote grant withdrawal
        run: python3 tests/system/remote_withdrawal.py
      - name: Verify run ownership and readiness with an offline provider
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/completion_readiness.py
      - name: Verify bounded final acceptance with three offline native providers
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/completion_gate.py
      - name: Verify runtime ownership release during frontend handoff
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/completion_handoff.py
      - name: Verify cooperative plain-chat cancellation and idle interrupt exit
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/plain_interrupt.py
      - run: python3 tests/system/vessel_lifecycle.py
      - name: Verify bounded independent evaluation oracles
        run: python3 tests/system/eval_oracle.py
      - name: Verify counted artifacts and completion accounting across native providers
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/eval_counting.py
      - name: Local inference allowance boundaries
        run: python3 tests/system/inference_budget.py
      - name: Verify evaluation runner and timeout evidence with an offline provider
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/eval_runner.py
      - name: Verify enrollment lifecycle CLI with real local Vessel
        run: python3 tests/system/attachment_enrollment.py
      - name: Verify hidden enrollment invitation entry on real terminal
        run: python3 tests/system/attachment_secret_prompt.py
      - name: Verify explicit repository onboarding with real CLI
        run: python3 tests/system/repo_onboarding.py
      - name: Verify explicit local-provider setup with offline HTTP fixtures
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/local_provider.py
      - name: Verify named profile lifecycle and explicit authority selection
        run: python3 tests/system/policy_profiles.py
      - name: Verify persistent private policy defaults
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/policy_defaults.py
      - name: TUI policy switching
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/tui_policy.py
      - name: Enforce the Linux administrator ceiling
        run: python3 tests/system/policy_ceiling.py
      - name: Verify foreground outbound attachment presence with real binaries
        run: python3 tests/system/attachment_presence.py
      - name: Outbound coordination control lifecycle
        run: python3 tests/system/coordination_control.py
      - name: Offline enrollment inventory, revocation and audit
        run: python3 tests/system/enrollment_inventory.py
      - name: Verify saved workflow CLI and native execution
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/saved_workflows.py
      - name: Verify saved workflow TUI forms and canonical native dispatch
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/tui_workflows.py
      - name: Verify terminal retention across native TUI voyage navigation
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/terminal_navigation.py
      - name: Verify private native terminal attachment and canonical persistence
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/terminal_privacy.py
      - name: Verify transient workflow secrets without public capture
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/workflow_secrets.py
      - name: Verify attended workflow collection and terminal recovery
        run: python3 tests/system/workflow_prompting.py
      - name: Declarative extension lifecycle
        run: python3 tests/system/extensions.py
      - name: Extension HTTPS indexes
        run: python3 tests/system/extension_index.py
      - run: python3 eval/run.py validate
      - run: ./scripts/package-release "ci-${{ github.sha }}"
      - run: cd dist && sha256sum -c *.sha256
      - run: ./scripts/package-installer "ci-${{ github.sha }}"
      - run: cd dist/installer-ci-${{ github.sha }} && sha256sum -c *.sha256
