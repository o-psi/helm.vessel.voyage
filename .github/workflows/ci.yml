name: quality
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release --locked
      - name: Prove native provider works without Codex
        env:
          HELM_BIN: target/release/helm
        run: python3 tests/system/native_provider_no_codex.py
      - run: python3 tests/system/vessel_lifecycle.py
      - run: python3 eval/run.py validate
      - run: ./scripts/package-release "ci-${{ github.sha }}"
      - run: cd dist && sha256sum -c *.sha256

  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release --locked
