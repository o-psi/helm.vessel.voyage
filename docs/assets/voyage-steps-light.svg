<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title"><title id="title">Choose a computer. Assign an outcome. Review the result.</title><rect x="1" y="1" width="1198" height="168" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
 <path d="M400 32V138M800 32V138" stroke="#e5e7eb"/><text x="32" y="47" fill="#be123c" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">01</text><text x="32" y="90" fill="#24292f" font-family="Arial, sans-serif" font-size="25" font-weight="700">Choose a computer</text><text x="32" y="124" fill="#57606a" font-family="Arial, sans-serif" font-size="18">Select the host and workspace.</text><text x="432" y="47" fill="#be123c" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">02</text><text x="432" y="90" fill="#24292f" font-family="Arial, sans-serif" font-size="25" font-weight="700">Assign an outcome</text><text x="432" y="124" fill="#57606a" font-family="Arial, sans-serif" font-size="18">Give the agent work to complete.</text><text x="832" y="47" fill="#be123c" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">03</text><text x="832" y="90" fill="#24292f" font-family="Arial, sans-serif" font-size="25" font-weight="700">Review the result</text><text x="832" y="124" fill="#57606a" font-family="Arial, sans-serif" font-size="18">Inspect changes and verification.</text></svg>